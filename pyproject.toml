[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "digital-life-lab"
version = "0.1.0"
description = "An offline, physically selected artificial-life laboratory"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=2.0,<3", "pygame-ce>=2.5,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/digital_ecosystem"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "digital_ecosystem/presets"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
